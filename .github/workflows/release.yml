name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/chore_quest/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a release when the version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version custom_components/chore_quest/manifest.json)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Chore Quest ${VERSION}" --notes-file RELEASE_NOTES.md
